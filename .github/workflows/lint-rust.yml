name: Lint Rust

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'

  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Єдиний Rust-crate репо живе в tauri-plugin-agent/ (кореневого
    # Cargo.toml немає) — без цього cargo fmt/clippy падають одразу.
    defaults:
      run:
        working-directory: tauri-plugin-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # clippy компілює tauri, якому на Linux потрібні системні -dev пакети
      # GTK/WebKitGTK — без них збірка падає одразу на pkg-config.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-agent

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
